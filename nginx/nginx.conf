# =============================================================================
# nginx/nginx.conf — the MAIN nginx configuration file.
#
# nginx reads this file first when it starts. We keep it short on purpose:
# the interesting parts live in two separate files, one per "layer":
#
#   l7-http.conf   -> the http {}   block: Layer 7 (HTTP-aware) load balancing
#   l4-stream.conf -> the stream {} block: Layer 4 (raw TCP)   load balancing
#
# Splitting them makes the key idea obvious: http and stream are two separate
# worlds inside nginx, with their own directives, upstreams and logs.
#
# See NGINX_EXPLAINED.md for a line-by-line walkthrough.
# =============================================================================

# How many worker processes handle traffic. Real servers use "auto" (one per
# CPU core). We use 1 ON PURPOSE: each worker keeps its own round-robin
# position and its own idea of which servers are failing, so with several
# workers the numbers in our experiments would look "random". One worker makes
# every experiment deterministic and easy to explain.
worker_processes 1;

# Where nginx writes its own errors (bad config, can't reach a backend, ...).
# /dev/stderr makes them show up in `docker compose logs nginx`.
error_log /dev/stderr warn;

# The events block configures how nginx handles connections at a low level.
# It must exist, even if it's nearly empty.
events {
    # Maximum simultaneous connections per worker. Note a proxied request uses
    # TWO connections (client -> nginx and nginx -> backend).
    worker_connections 1024;
}

# Pull in the Layer 7 config. That file contains a complete http { ... } block.
include /etc/nginx/lab/l7-http.conf;

# Pull in the Layer 4 config. That file contains a complete stream { ... } block.
include /etc/nginx/lab/l4-stream.conf;
