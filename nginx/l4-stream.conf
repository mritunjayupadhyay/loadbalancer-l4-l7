# =============================================================================
# nginx/l4-stream.conf — LAYER 4 (TCP) LOAD BALANCING
#
# Everything inside "stream { }" works at the TRANSPORT layer. nginx accepts a
# TCP connection, picks a backend, opens a second TCP connection to it, and
# then just copies bytes back and forth. It NEVER parses those bytes.
#
# Consequences you will see in the experiments:
#   * HTTP still works through here (bytes are bytes) ...
#   * ... but nginx cannot add X-Forwarded-For (it would have to edit the HTTP
#     request, which it doesn't understand at this layer),
#   * it cannot route by URL path or header (it never reads them),
#   * it balances CONNECTIONS, not requests. A keep-alive connection carrying
#     100 HTTP requests goes to ONE backend.
#   * any TCP protocol works — even our made-up tcp-echo protocol.
#
# Because a port can only have one algorithm, each algorithm gets its own port:
#   9090  round robin     -> Express apps (HTTP over plain TCP)
#   9091  least_conn      -> Express apps
#   9092  hash consistent -> Express apps
#   9000  round robin     -> tcp-echo servers (NOT HTTP)
# =============================================================================

stream {

    # -------------------------------------------------------------------------
    # LOGGING
    # Stream logs are written once per CONNECTION, when it closes (there are no
    # "requests" at this layer). Notice what's missing compared with the L7
    # log: no method, no URL, no HTTP status. nginx simply doesn't know them.
    #   $server_port      which of our listen ports the client connected to
    #   $upstream_addr    which backend got this connection
    #   $status           200 = session OK, 502 = couldn't reach a backend
    #                     (these are nginx's own codes, not HTTP statuses)
    #   $bytes_received   bytes from the client;  $bytes_sent  bytes to client
    #   $session_time     how long the TCP connection lasted
    # -------------------------------------------------------------------------
    log_format lab_l4 'L4 $remote_addr -> :$server_port upstream=$upstream_addr '
                      'status=$status bytes_in=$bytes_received bytes_out=$bytes_sent '
                      'session=${session_time}s';

    access_log /dev/stdout lab_l4;

    # =========================================================================
    # UPSTREAMS — same idea as in http {}, but these are just IP:port targets.
    # Passive health checks (max_fails / fail_timeout) work here too; they are
    # based on whether the TCP CONNECTION succeeds, since nginx can't see HTTP
    # status codes.
    # =========================================================================

    # Round robin (default): connection 1 -> app1, 2 -> app2, 3 -> app3, ...
    upstream l4_http_rr {
        server app1:4000 max_fails=1 fail_timeout=10s;
        server app2:4000 max_fails=1 fail_timeout=10s;
        server app3:4000 max_fails=1 fail_timeout=10s;
    }

    # Least connections: pick the backend with the fewest open TCP connections.
    upstream l4_http_least {
        least_conn;
        server app1:4000;
        server app2:4000;
        server app3:4000;
    }

    # Consistent hash of the client's IP address. Unlike ip_hash (http only),
    # this uses the WHOLE address. Same client IP -> same backend, every time.
    # "consistent" (ketama hashing) means adding or removing a backend only
    # remaps about 1/N of the clients.
    upstream l4_http_hash {
        hash $remote_addr consistent;
        server app1:4000;
        server app2:4000;
        server app3:4000;
    }

    # The non-HTTP echo servers.
    upstream l4_echo {
        server tcp-echo-1:7000;
        server tcp-echo-2:7000;
        server tcp-echo-3:7000;
    }

    # =========================================================================
    # SERVERS — in stream {}, a server is just "listen on a port, forward to
    # an upstream". There are no locations: no URL exists at this layer.
    # =========================================================================

    # Settings placed here (outside any server) apply to all servers below.
    proxy_connect_timeout 1s;   # give up on a dead backend quickly ...
    proxy_next_upstream on;     # ... and try the next one (on is the default)
    proxy_timeout 65s;          # close a connection idle for 65 s

    server {
        listen 9090;
        proxy_pass l4_http_rr;      # note: no "http://" — it's just TCP here
    }

    server {
        listen 9091;
        proxy_pass l4_http_least;
    }

    server {
        listen 9092;
        proxy_pass l4_http_hash;
    }

    server {
        listen 9000;
        proxy_pass l4_echo;
    }
}
