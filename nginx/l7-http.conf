# =============================================================================
# nginx/l7-http.conf — LAYER 7 (HTTP) LOAD BALANCING
#
# Everything inside "http { }" understands HTTP. nginx fully reads each request
# (method, URL, headers) BEFORE choosing a backend. That is what lets it:
#   * route by URL path            (/api/ vs /static/)
#   * route by header              (X-Version: beta)
#   * add headers                  (X-Forwarded-For, X-Real-IP, ...)
#   * retry a failed request on another server
#
# All of this is served on ONE port: 8080. Each load-balancing algorithm gets
# its own URL prefix (/rr/, /weighted/, /least/, ...) so you can compare them
# side by side without editing this file.
#
# Backend addresses: "app1:3000" means "the container called app1, port 3000".
# Docker's built-in DNS turns the name app1 into its IP address (10.10.10.11,
# set in docker-compose.yml).
# =============================================================================

http {

    # -------------------------------------------------------------------------
    # LOGGING
    # A custom access-log format that shows WHICH backend served each request.
    #   $remote_addr          the client's IP (as nginx sees it)
    #   $request              e.g. "GET /rr/ HTTP/1.1"
    #   $status               HTTP status code sent to the client
    #   $upstream_addr        the backend IP:port nginx forwarded to. If nginx
    #                         had to retry, you'll see several, comma-separated.
    #   $upstream_status      the status each backend returned
    #   $upstream_response_time  how long the backend took (seconds)
    # -------------------------------------------------------------------------
    log_format lab_l7 'L7 $remote_addr "$request" status=$status '
                      'upstream=$upstream_addr upstream_status=$upstream_status '
                      'time=${upstream_response_time}s';

    # Write the log to stdout so `docker compose logs -f nginx` shows it.
    access_log /dev/stdout lab_l7;

    # Every response nginx generates itself (error pages) is JSON-ish text.
    default_type application/json;

    # =========================================================================
    # UPSTREAMS — named groups of backend servers.
    # An "upstream" is just a list of servers plus a rule for picking one.
    # We define one upstream per algorithm so each can be tested separately.
    # =========================================================================

    # --- 1. ROUND ROBIN (the default) -----------------------------------------
    # No algorithm directive = round robin: app1, app2, app3, app1, app2, ...
    #
    # --- 7. PASSIVE HEALTH CHECKS live here too -------------------------------
    #   max_fails=1     after 1 failed attempt ...
    #   fail_timeout=10s  ... treat the server as DOWN for 10 seconds, then
    #                     quietly try it again with a real request.
    # "Passive" = nginx only notices a problem when a real user request fails.
    # (Active checks — nginx polling /health on a timer — are nginx Plus only.)
    upstream backend_rr {
        server app1:3000 max_fails=1 fail_timeout=10s;
        server app2:3000 max_fails=1 fail_timeout=10s;
        server app3:3000 max_fails=1 fail_timeout=10s;
    }

    # --- 2. WEIGHTED ROUND ROBIN -----------------------------------------------
    # weight=3 means app1 gets 3 requests for every 1 that app2 or app3 gets.
    # Use it when servers have different capacity (e.g. app1 is a bigger
    # machine). Expected split: 60% / 20% / 20%.
    upstream backend_weighted {
        server app1:3000 weight=3;
        server app2:3000;          # weight defaults to 1
        server app3:3000;
    }

    # --- 3. LEAST CONNECTIONS ---------------------------------------------------
    # Send each new request to the server with the FEWEST active connections.
    # Great when requests take very different amounts of time: a server stuck
    # on slow requests automatically gets less new work.
    upstream backend_least {
        least_conn;
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    # --- 4. IP HASH (session affinity / "sticky by IP") -------------------------
    # nginx hashes the client's IP address, so the same client always lands on
    # the same server (as long as that server is up).
    # GOTCHA: for IPv4, ip_hash only uses the first THREE octets
    # (e.g. 192.168.1.x). Every client in the same /24 network lands on the
    # same server!
    upstream backend_iphash {
        ip_hash;
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    # --- CONSISTENT HASH on a header (bonus) ------------------------------------
    # Like ip_hash, but we choose the key: here the X-User-Id request header.
    # Same user id -> same server, different users spread out. "consistent"
    # means adding/removing a server only moves ~1/N of the users, instead of
    # reshuffling almost everyone.
    upstream backend_userhash {
        hash $http_x_user_id consistent;
        server app1:3000;
        server app2:3000;
        server app3:3000;
    }

    # --- 5. POOLS FOR PATH-BASED ROUTING ----------------------------------------
    # Different URL paths can go to completely different groups of servers.
    # Imagine app1+app2 run your API and app3 serves static files.
    upstream api_pool {
        server app1:3000;
        server app2:3000;
    }
    upstream static_pool {
        server app3:3000;
    }

    # --- 6. POOLS FOR HEADER-BASED ROUTING --------------------------------------
    # "stable" is what normal users get; "beta" is the new version that only
    # testers get (this is how canary/beta releases are often done).
    upstream stable_pool {
        server app1:3000;
        server app2:3000;
    }
    upstream beta_pool {
        server app3:3000;
    }

    # A map creates a new variable whose value depends on another variable.
    # Here: look at the X-Version request header ($http_x_version — nginx turns
    # any header into $http_<name>, lowercase, dashes become underscores).
    #   X-Version: beta  -> $version_pool = "beta_pool"
    #   anything else    -> $version_pool = "stable_pool"
    # A Layer 4 balancer could never do this: it never reads headers.
    map $http_x_version $version_pool {
        default  stable_pool;
        beta     beta_pool;
    }

    # =========================================================================
    # THE SERVER — one virtual server listening on port 8080.
    # =========================================================================
    server {
        listen 8080;

        # --- 8. HEADERS nginx ADDS TO EVERY PROXIED REQUEST ---------------------
        # Without these, the backend would only ever see nginx's IP and would
        # lose the original Host. These are set here, at server level, so every
        # location below inherits them.
        # GOTCHA: if a location defines ANY proxy_set_header of its own, it
        # stops inheriting ALL of these. So we never do that below.
        proxy_set_header Host              $host;                       # the hostname the client asked for
        proxy_set_header X-Real-IP         $remote_addr;                # the client's IP
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;  # client IP appended to any existing chain
        proxy_set_header X-Forwarded-Proto $scheme;                     # "http" or "https"

        # A RESPONSE header so the client can see which backend answered.
        # "always" = add it even on error responses (502, 504, ...).
        add_header X-Upstream-Server $upstream_addr always;

        # --- 7. FAILOVER: what to do when a backend fails -----------------------
        # If connecting to a backend errors, times out, or it returns 502/503/504,
        # try the NEXT server in the upstream instead of returning an error.
        # Note: nginx never retries POST (non-idempotent) requests by default,
        # because repeating a POST could e.g. charge a credit card twice.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;   # try at most 3 servers per request

        # Give up connecting to a backend after 1 second. A crashed container's
        # IP simply stops answering, so without a short timeout the user would
        # wait up to 60 s (the default) before nginx tries the next server.
        proxy_connect_timeout 1s;

        # Allow slow responses (our /slow endpoint can take up to 60 s).
        proxy_read_timeout 65s;

        # --- DEFAULT: "/" uses round robin --------------------------------------
        # "location /" matches every URL that no more specific location matched.
        location / {
            proxy_pass http://backend_rr;
        }

        # --- 1. ROUND ROBIN at /rr/ ----------------------------------------------
        # The trailing slash after backend_rr matters! It tells nginx to REPLACE
        # the matched prefix "/rr/" with "/". So:
        #   /rr/            -> backend receives /
        #   /rr/slow?ms=10  -> backend receives /slow?ms=10
        location /rr/ {
            proxy_pass http://backend_rr/;
        }

        # --- 2. WEIGHTED at /weighted/ -------------------------------------------
        location /weighted/ {
            proxy_pass http://backend_weighted/;
        }

        # --- 3. LEAST CONNECTIONS at /least/ -------------------------------------
        location /least/ {
            proxy_pass http://backend_least/;
        }

        # --- 4. IP HASH at /iphash/ ----------------------------------------------
        location /iphash/ {
            proxy_pass http://backend_iphash/;
        }

        # --- CONSISTENT HASH on X-User-Id at /userhash/ ---------------------------
        location /userhash/ {
            proxy_pass http://backend_userhash/;
        }

        # --- 5. PATH-BASED ROUTING ------------------------------------------------
        # NO trailing slash after the upstream name this time, so nginx passes
        # the URL through UNCHANGED: /api/info -> backend receives /api/info.
        # (Compare with /rr/ above, where the prefix is stripped.)
        location /api/ {
            proxy_pass http://api_pool;      # app1 + app2 only
        }
        location /static/ {
            proxy_pass http://static_pool;   # app3 only
        }

        # --- 6. HEADER-BASED ROUTING at /version/ --------------------------------
        # $version_pool comes from the map above: "stable_pool" or "beta_pool".
        # When proxy_pass uses a variable, nginx can't strip the prefix for us,
        # so we do it ourselves with rewrite:
        #   /version/      -> /
        #   /version/slow  -> /slow
        # "break" = stop rewriting and use the new URL right here.
        location /version/ {
            rewrite ^/version/(.*)$ /$1 break;
            proxy_pass http://$version_pool;
        }

        # A health endpoint for nginx ITSELF (doesn't touch any backend).
        # "=" means exact match: only /nginx-health, nothing longer.
        location = /nginx-health {
            return 200 '{"status":"ok","from":"nginx (layer 7)"}\n';
        }
    }
}
